<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footer</title>
<style>
  :root {
    --footer-bg: #2f3a45;
    --footer-text: #e6e9ec;
    --footer-muted: #aab3bb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #222;
    background: #fff;
  }

  main {
    flex: 1;
    padding: 48px 24px;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }

  /* ---------- Footer ---------- */
  .site-footer {
    background: var(--footer-bg);
    color: var(--footer-text);
    font-size: 14px;
    line-height: 1.5;
  }

  .footer-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }

  .footer-legal {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 32px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  @media (max-width: 520px) {
    .footer-legal {
      flex-direction: column;
      gap: 12px;
    }
  }
</style>
</head>
<body>

<main>
  <h1>Beispielseite</h1>
  <p>Hier steht der Seiteninhalt. Der Footer klebt unten am Seitenende.</p>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <ul class="footer-legal">
      <li>Rechtliches</li>
      <li>Datenschutz</li>
      <li>Barrierefreiheit</li>
      <li>Impressum</li>
    </ul>
  </div>
</footer>

</body>
</html>
